name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish release
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write      # create the GitHub release and upload assets
      id-token: write      # sign the build-provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Unit tests
        run: swift test

      - name: Release bundle (arm64, ad-hoc signed)
        run: scripts/build.sh

      - name: Integration and installer tests
        run: |
          scripts/integration-test.sh
          scripts/installer-roundtrip-test.sh

      - name: Package
        run: scripts/package-release.sh

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .build/release-assets/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd .build/release-assets
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" ./*.zip SHA256SUMS.txt \
              --title "Claude Status ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
          fi
