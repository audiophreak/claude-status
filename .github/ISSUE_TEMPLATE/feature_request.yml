name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: textarea
    id: hooks
    attributes:
      label: Claude Code events involved
      description: Which documented hook events or fields would this rely on? (https://code.claude.com/docs/en/hooks)
